		<main>
			<header class="mainHeader">
				<br>
                <h2>
					Contact Me
				</h2>
				<br>
				<hr>
			</header>

			<section class="firstSection">
				<dialog>
					<h2>
						Form Subitted
					</h2>

					<p> 
						Your contact request has been submitted, 
						expect a response in <em> 5 </em> business days.
						

					</p>
				</dialog>
				<noscript>
					<p>
						No Javascript enabled... 
						Here's my Email!
					</p>
					<strong> anthonylestrella06@gmail.com</strong>
				</noscript>
				<form class="contactForm" method="post" action="https://httpbin.org/post">
					<fieldset>
						<legend>
							Contact Form
						</legend>
						<div class="formRow">
							<label for="Name" > Name </label>
							<input type="text" id="Name" name="Name" autocomplete="name"  minlength="1" maxlength="100" required  placeholder="Enter your name! 1-100 characters. ">
						</div>
						<br> 
						<div class="formRow">
							<label for="Email"> Email </label>
							<input type="email" id="Email" name="Email" placeholder="abc@hostname.com" required autocomplete="email">
						</div>
						<br> 

						<div class="formRow">
							<label for="Number"> Number </label>
							<input type="tel" id="Number" name="Number" placeholder="Phone Number (xxx-xxx-xxxx)">
						</div>


						<br> 
						<div class="formRow">
							<label for="comments"> Comments </label>
							<textarea id="comments" name="comments" minlength="10" maxlength="1000" required placeholder="Leave up to an 1000 word comment!"></textarea>						
						</div>
						
						<div>
							<label for="possible_bot"></label>
							<input type="hidden" id="possible_bot" name="possible_bot" value="true">
						</div>
					
						<br>
						<div class="formRow">
							<button> Submit </button>
						</div>

					</fieldset>
				</form>
			</section>

			<hr>
		</main>
